# Проверка сборки.
#
# Раньше этот workflow пытался публиковать сайт на GitHub Pages и падал на шаге
# upload-pages-artifact: тот ищет папку dist, а проект собирается в .output
# (в vite.config.ts стоит nitro: { preset: "node-server" }). Сайт разворачивает
# Timeweb напрямую из репозитория, GitHub Pages для этого не используется —
# поэтому шаги публикации убраны, остался только билд.
#
# Теперь значок у коммита означает ровно одно: зелёный — код собирается,
# красный — сборка сломана и на это надо смотреть.
name: Build check

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
